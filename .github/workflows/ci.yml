# Diagnostic branch only: do not merge this workflow replacement into main.
name: Browser offboarding reauthentication diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    name: Actual registration and offboarding UI (${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: browser_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: browser_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U browser_test -d browser_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OAUTH_TEST_DATABASE_URL: postgres://browser_test:disposable_test_password@127.0.0.1:5432/browser_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install native Redis test server
        run: sudo apt-get update && sudo apt-get install --yes redis-server
      - name: Install actual service dependencies
        run: |
          for service in services/core/policy-service services/core/api-gateway services/core/license-management services/core/identity-service services/core/device-service services/core/oauth-provider services/core/authentication-service services/platform/quick-actions; do
            if [ -f "$service/package-lock.json" ]; then
              npm ci --prefix "$service" --ignore-scripts --no-audit --no-fund
            else
              npm install --prefix "$service" --ignore-scripts --no-audit --no-fund --package-lock=false
            fi
          done
      - name: Install actual web application dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install integration-test Chromium
        working-directory: frontend/web-app
        run: npx playwright install --with-deps chromium
      - name: Test the full original registration and offboarding browser journey
        run: >-
          node --test --test-reporter=tap --test-reporter-destination=stdout
          --test-reporter=./scripts/lib/nonempty-test-reporter.cjs --test-reporter-destination=stderr
          --test-name-pattern='^real company registration UI persists'
          services/core/oauth-provider/src/__tests__/browser.postgres.cjs
