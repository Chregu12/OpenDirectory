# Diagnostic branch only: do not merge this replacement into main.
name: Company license source diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  registration:
    name: Signed blueprint journeys with original authority (${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: license_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: license_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U license_test -d license_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      OAUTH_TEST_DATABASE_URL: postgres://license_test:disposable_test_password@127.0.0.1:5432/license_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install actual service dependencies
        run: |
          for service in services/core/policy-service services/core/api-gateway services/core/license-management services/core/identity-service services/core/device-service services/core/oauth-provider services/platform/quick-actions; do
            npm install --prefix "$service" --ignore-scripts --no-audit --no-fund --package-lock=false
          done
      - name: Test both actual blueprint journeys with original authority
        run: >-
          node --test --test-reporter=tap --test-reporter-destination=stdout
          --test-reporter=./scripts/lib/nonempty-test-reporter.cjs --test-reporter-destination=stderr
          --test-name-pattern='^production gateway (registers an actual roleless company blueprint Owner|applies actual roleless company blueprint license origins)'
          services/core/oauth-provider/src/__tests__/revocations.postgres.cjs
