# Diagnostic branch only: never merge this workflow replacement into main.
name: Offboarding request phase diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  offboarding:
    name: Original offboarding request (${{ matrix.database }})
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        database: [fresh, history]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: diagnostic_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: diagnostic_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U diagnostic_test -d diagnostic_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LICENSE_TEST_DATABASE_URL: postgres://diagnostic_test:disposable_test_password@127.0.0.1:5432/diagnostic_test
      IDENTITY_TEST_DATABASE_URL: postgres://diagnostic_test:disposable_test_password@127.0.0.1:5432/diagnostic_test
      OAUTH_TEST_DATABASE_URL: postgres://diagnostic_test:disposable_test_password@127.0.0.1:5432/diagnostic_test
      OD_DIAGNOSTIC_SOURCE_ROOT: ${{ github.workspace }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install the actual test service dependencies
        run: |
          npm ci --prefix services/core/policy-service --ignore-scripts --no-audit --no-fund
          npm ci --prefix services/core/api-gateway --ignore-scripts --no-audit --no-fund
          npm ci --prefix services/core/license-management --ignore-scripts --no-audit --no-fund
          npm install --prefix services/core/identity-service --package-lock=false --ignore-scripts --no-audit --no-fund
          npm ci --prefix services/core/device-service --ignore-scripts --no-audit --no-fund
          npm install --prefix services/core/oauth-provider --package-lock=false --ignore-scripts --no-audit --no-fund
          npm install --prefix services/platform/quick-actions --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Run the original preceding license suite
        if: matrix.database == 'history'
        working-directory: services/core/policy-service
        run: npm run test:licenses:integration
      - name: Run the original preceding Identity suite
        if: matrix.database == 'history'
        working-directory: services/core/identity-service
        run: npm run test:groups:integration
      - name: Run the original OAuth partitions with their original budgets
        if: matrix.database == 'history'
        working-directory: services/core/oauth-provider
        run: npm run test:revocations:integration
      - name: Observe the original case against a fresh database
        if: matrix.database == 'fresh'
        run: >-
          node --test --test-reporter=tap --test-reporter-destination=stdout
          --test-reporter=./scripts/lib/nonempty-test-reporter.cjs --test-reporter-destination=stderr
          --test-concurrency=1
          --require=./scripts/lib/offboarding-request-diagnostic.cjs
          --test-name-pattern='^production gateway does not treat a real credential-bound pending company registration'
          services/core/oauth-provider/src/__tests__/revocations.postgres.cjs
