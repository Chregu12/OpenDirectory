# Diagnostic branch only: do not merge this workflow replacement into main.
name: Device OU retirement source diagnostic
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  automation:
    name: Actual original OU retirement source (${{ matrix.attempt }})
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        attempt: [1, 2, 3]
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: automation_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: automation_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U automation_test -d automation_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      IDENTITY_TEST_DATABASE_URL: postgres://automation_test:disposable_test_password@127.0.0.1:5432/automation_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install actual Identity and Device dependencies
        run: |
          npm install --prefix services/core/identity-service --package-lock=false --ignore-scripts --no-audit --no-fund
          npm ci --prefix services/core/device-service --ignore-scripts --no-audit --no-fund
      - name: Test original retirement source and lock ordering
        run: >-
          node --test --test-reporter=tap --test-reporter-destination=stdout
          --test-reporter=./scripts/lib/nonempty-test-reporter.cjs --test-reporter-destination=stderr
          --test-concurrency=1
          --test-name-pattern='^device OU retirement source'
          services/core/identity-service/src/__tests__/companyRoles.postgres.cjs
