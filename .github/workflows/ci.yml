name: CI Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  workflow_dispatch:

env:
  NODE_VERSION: "20"

permissions:
  contents: read

jobs:
  # ===================
  # Code Quality
  # ===================
  lint:
    name: Workflow validation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Validate GitHub Actions workflows
        run: |
          curl --fail --silent --show-error --location https://github.com/rhysd/actionlint/releases/download/v1.7.12/actionlint_1.7.12_linux_amd64.tar.gz --output "$RUNNER_TEMP/actionlint.tar.gz"
          printf '%s  %s\n' '8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8' "$RUNNER_TEMP/actionlint.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/actionlint.tar.gz" -C "$RUNNER_TEMP" actionlint
          "$RUNNER_TEMP/actionlint" -color

      - name: Check workflow formatting
        run: |
          npx --no-install prettier --check .github/workflows/ci.yml .github/workflows/release.yml

  # ===================
  # Testing
  # ===================
  test:
    name: Service manifest validation
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Check service structure
        run: |
          echo "Checking service structure..."
          ls -la services/
          echo "Core services:"
          test -d services/core/
          echo "Platform services:"
          test -d services/platform/

      - name: Validate package.json files
        run: |
          echo "Validating package.json files..."
          git ls-files -z -- '*/package.json' package.json | xargs -0 -n 1 node -e 'JSON.parse(require("fs").readFileSync(process.argv[1], "utf8"))'

  # ===================
  # Service Tests
  # ===================
  credential-integration:
    name: Credentials and employee invitation PostgreSQL / HTTP integration
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: credential_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: credential_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U credential_test -d credential_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      AUTH_TEST_DATABASE_URL: postgres://credential_test:disposable_test_password@127.0.0.1:5432/credential_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Install native Redis test server
        run: sudo apt-get update && sudo apt-get install --yes redis-server
      - name: Install credential service dependencies
        working-directory: services/core/authentication-service
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install canonical Identity dependencies
        working-directory: services/core/identity-service
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Install invitation Gateway dependencies
        working-directory: services/core/oauth-provider
        run: npm install --package-lock=false --ignore-scripts --no-audit --no-fund
      - name: Test credentials and actual employee invitation receivers
        working-directory: services/core/authentication-service
        run: npm run test:credentials:integration

  license-integration:
    name: License and Identity PostgreSQL / Browser Integration
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: license_test
          POSTGRES_PASSWORD: disposable_test_password
          POSTGRES_DB: license_test
          POSTGRES_INITDB_ARGS: "-c max_locks_per_transaction=256"
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U license_test -d license_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      LICENSE_TEST_DATABASE_URL: postgres://license_test:disposable_test_password@127.0.0.1:5432/license_test
      IDENTITY_TEST_DATABASE_URL: postgres://license_test:disposable_test_password@127.0.0.1:5432/license_test
      OAUTH_TEST_DATABASE_URL: postgres://license_test:disposable_test_password@127.0.0.1:5432/license_test
    defaults:
      run:
        working-directory: services/core/policy-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install verified gateway dependencies
        working-directory: services/core/api-gateway
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install canonical license adapter dependencies
        working-directory: services/core/license-management
        run: npm ci --ignore-scripts --no-audit --no-fund
      - run: npm run test:licenses:integration
      - name: Install identity integration dependencies
        working-directory: services/core/identity-service
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install device integration dependencies
        working-directory: services/core/device-service
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Test authoritative group snapshots
        working-directory: services/core/identity-service
        run: npm run test:groups:integration
      - name: Install issuer integration dependencies
        working-directory: services/core/oauth-provider
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Install delegated orchestration dependencies
        working-directory: services/platform/quick-actions
        run: npm install --ignore-scripts --no-audit --no-fund --package-lock=false
      - name: Test durable cross-service token, PIM and delegated orchestration revocation
        working-directory: services/core/oauth-provider
        run: npm run test:revocations:integration
      - name: Install browser mediation dependencies
        working-directory: .
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install integration-test Chromium
        working-directory: frontend/web-app
        run: npx playwright install --with-deps chromium
      - name: Test browser mediation security boundaries
        working-directory: frontend/web-app
        run: npm run test:browser-auth
      - name: Install actual browser credential receiver dependencies
        working-directory: services/core/authentication-service
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Install native Redis for actual browser credentials
        run: sudo apt-get update && sudo apt-get install --yes redis-server
      - name: Test actual confidential browser login and persistent logout
        working-directory: services/core/oauth-provider
        run: npm run test:browser:integration

  service-tests:
    name: Service Tests
    runs-on: ubuntu-latest
    needs: lint

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # Each expected service must still provide a real test command.
      - name: Verify expected test paths exist
        run: |
          set -e
          missing=0
          for d in \
            services/core/authentication-service \
            services/core/device-service \
            services/core/policy-service \
            services/core/license-management \
            services/core/conditional-access \
            services/core/api-gateway \
            services/core/printer-service \
            services/core/samba-ad-dc \
            services/core/apple-mdm \
            services/core/certificate-authority \
            services/core/identity-service \
            services/core/kerberos-kdc \
            services/core/least-privilege \
            services/core/network-infrastructure \
            services/core/oauth-provider \
            services/platform/quick-actions \
            services/platform/api-backend \
            services/platform/api-gateway \
            services/platform/integration-service \
            services/enterprise/antivirus-protection \
            services/enterprise/app-store \
            services/enterprise/auto-remediation \
            services/enterprise/device-lifecycle \
            services/enterprise/graph-explorer \
            services/enterprise/policy-simulator \
            services/enterprise/security-scanner \
            services/enterprise/compliance-engine \
            services/core/monitoring-service \
            packages/grpc-event-bus \
            frontend/web-app ; do
            if ! node -e 'const p=require(process.cwd()+"/"+process.argv[1]+"/package.json"); if(typeof p.scripts?.test!=="string" || !p.scripts.test.trim()) process.exit(1)' "$d"; then
              echo "::error::Expected real test script missing: $d/package.json"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            echo "One or more expected test paths are missing — failing the job."
            exit 1
          fi
          echo "All expected test paths present."

      - name: Test device-service
        id: test_device
        run: cd services/core/device-service && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test database restore CLI and schema comparisons
        env:
          RESTORE_TEST_DOCKER_CONTEXT: default
        run: python3 deploy/k8s/test_verify_postgres_restore.py -v

      - name: Test app-account automation client
        id: test_automation_client
        run: npm run test:automation-client

      - name: Test conditional-access
        id: test_conditional_access
        run: cd services/core/conditional-access && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test api-gateway (core)
        id: test_api_gateway
        run: cd services/core/api-gateway && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test printer-service
        id: test_printer
        run: cd services/core/printer-service && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      # samba-ad-dc uses node's built-in test runner (`node --test`), which
      # does NOT accept the jest flags, so invoke npm test with no extra args.
      - name: Test samba-ad-dc
        id: test_samba
        run: cd services/core/samba-ad-dc && npm ci --ignore-scripts --no-audit --no-fund && npm test

      - name: Test api-backend (platform)
        id: test_api_backend
        run: cd services/platform/api-backend && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test api-gateway (platform)
        id: test_platform_api_gateway
        run: cd services/platform/api-gateway && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test apple-mdm
        id: test_apple_mdm
        run: cd services/core/apple-mdm && npm ci --ignore-scripts --no-audit --no-fund && npm test

      - name: Test certificate-authority
        id: test_certificate_authority
        run: cd services/core/certificate-authority && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test identity-service
        id: test_identity_service
        run: cd services/core/identity-service && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      # kerberos-kdc uses node's built-in test runner (`node --test`), same as
      # samba-ad-dc above — no jest flags.
      - name: Test kerberos-kdc
        id: test_kerberos_kdc
        run: cd services/core/kerberos-kdc && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test

      - name: Test least-privilege
        id: test_least_privilege
        run: cd services/core/least-privilege && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test network-infrastructure
        id: test_network_infrastructure
        run: cd services/core/network-infrastructure && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test oauth-provider
        id: test_oauth_provider
        run: cd services/core/oauth-provider && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      # integration-service is TypeScript (ts-jest); `jest` transpiles on the
      # fly via ts-jest, so plain `npm install` is sufficient — no separate
      # `npm run build` step is needed to run the tests.
      - name: Test integration-service
        id: test_integration_service
        run: cd services/platform/integration-service && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test antivirus-protection
        id: test_antivirus_protection
        run: cd services/enterprise/antivirus-protection && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test app-store
        id: test_app_store
        run: cd services/enterprise/app-store && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test auto-remediation
        id: test_auto_remediation
        run: cd services/enterprise/auto-remediation && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test device-lifecycle
        id: test_device_lifecycle
        run: cd services/enterprise/device-lifecycle && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test graph-explorer
        id: test_graph_explorer
        run: cd services/enterprise/graph-explorer && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test policy-simulator
        id: test_policy_simulator
        run: cd services/enterprise/policy-simulator && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test security-scanner
        id: test_security_scanner
        run: cd services/enterprise/security-scanner && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test compliance-engine
        id: test_compliance_engine
        run: cd services/enterprise/compliance-engine && npm install --package-lock=false --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test monitoring-service
        id: test_monitoring_service
        run: cd services/core/monitoring-service && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test policy-service
        id: test_policy
        run: cd services/core/policy-service && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test quick-actions
        id: test_quick_actions
        run: cd services/platform/quick-actions && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      - name: Test canonical license compatibility adapter
        id: test_license_adapter
        run: cd services/core/license-management && npm ci --ignore-scripts --no-audit --no-fund && npm test

      - name: Test authentication-service
        id: test_authentication
        run: cd services/core/authentication-service && npm ci --ignore-scripts --no-audit --no-fund && npm test -- --forceExit

      # ---------------------------------------------------------------
      # Frontend
      # ---------------------------------------------------------------
      - name: Frontend unit tests (Jest)
        id: test_frontend_jest
        run: cd frontend/web-app && npm ci && npm test

      - name: Test shared event bus
        id: test_event_bus
        run: npm test --workspace @opendirectory/grpc-event-bus -- --runInBand

      - name: Frontend e2e tests (Playwright)
        id: test_frontend_e2e
        run: cd frontend/web-app && npm ci && npx playwright install --with-deps chromium && npm run test:e2e

      - name: Preserve browser test evidence
        if: ${{ !cancelled() && (steps.test_frontend_e2e.outcome == 'success' || steps.test_frontend_e2e.outcome == 'failure') }}
        uses: actions/upload-artifact@v4
        with:
          name: frontend-browser-evidence
          path: frontend/web-app/e2e/test-results/
          if-no-files-found: ignore
          retention-days: 7

      - name: Test summary
        if: always()
        run: |
          echo "=== Service Test Results (all steps below are gating — no continue-on-error) ==="
          echo "automation client        : ${{ steps.test_automation_client.outcome }}"
          echo "device-service           : ${{ steps.test_device.outcome }}"
          echo "conditional-access       : ${{ steps.test_conditional_access.outcome }}"
          echo "api-gateway (core)       : ${{ steps.test_api_gateway.outcome }}"
          echo "printer-service          : ${{ steps.test_printer.outcome }}"
          echo "samba-ad-dc              : ${{ steps.test_samba.outcome }}"
          echo "api-backend (platform)   : ${{ steps.test_api_backend.outcome }}"
          echo "api-gateway (platform)   : ${{ steps.test_platform_api_gateway.outcome }}"
          echo "apple-mdm                : ${{ steps.test_apple_mdm.outcome }}"
          echo "certificate-authority    : ${{ steps.test_certificate_authority.outcome }}"
          echo "identity-service         : ${{ steps.test_identity_service.outcome }}"
          echo "kerberos-kdc             : ${{ steps.test_kerberos_kdc.outcome }}"
          echo "least-privilege          : ${{ steps.test_least_privilege.outcome }}"
          echo "network-infrastructure   : ${{ steps.test_network_infrastructure.outcome }}"
          echo "oauth-provider           : ${{ steps.test_oauth_provider.outcome }}"
          echo "integration-service      : ${{ steps.test_integration_service.outcome }}"
          echo "antivirus-protection     : ${{ steps.test_antivirus_protection.outcome }}"
          echo "app-store                : ${{ steps.test_app_store.outcome }}"
          echo "auto-remediation         : ${{ steps.test_auto_remediation.outcome }}"
          echo "device-lifecycle         : ${{ steps.test_device_lifecycle.outcome }}"
          echo "graph-explorer           : ${{ steps.test_graph_explorer.outcome }}"
          echo "policy-simulator         : ${{ steps.test_policy_simulator.outcome }}"
          echo "security-scanner         : ${{ steps.test_security_scanner.outcome }}"
          echo "policy-service           : ${{ steps.test_policy.outcome }}"
          echo "license adapter          : ${{ steps.test_license_adapter.outcome }}"
          echo "quick-actions            : ${{ steps.test_quick_actions.outcome }}"
          echo "authentication-service   : ${{ steps.test_authentication.outcome }}"
          echo "frontend unit (jest)     : ${{ steps.test_frontend_jest.outcome }}"
          echo "shared event bus         : ${{ steps.test_event_bus.outcome }}"
          echo "frontend e2e (playwright): ${{ steps.test_frontend_e2e.outcome }}"
          echo ""
          echo "compliance-engine        : ${{ steps.test_compliance_engine.outcome }}"
          echo "monitoring-service       : ${{ steps.test_monitoring_service.outcome }}"

  # ===================
  # Security Scanning
  # ===================
  security:
    name: Security Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Install dependencies
        run: |
          if [ -f "package-lock.json" ]; then
            npm ci --ignore-scripts
          else
            npm install --ignore-scripts
          fi

      - name: Run npm audit
        run: |
          npm audit --audit-level=high

  runtime-images:
    name: App Store and Kerberos image startup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Build and exercise isolated service images
        run: npm run test:runtime-images

  # ===================
  # Docker Build Check
  # ===================
  docker-check:
    name: Docker build configuration
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        compose: [docker-compose.yml, docker-compose.lite.yml]
    env:
      DB_PASSWORD: ci_only
      POSTGRES_PASSWORD: ci_only
      REDIS_PASSWORD: ci_only
      MONGO_PASSWORD: ci_only
      RABBITMQ_PASSWORD: ci_only
      LLDAP_ADMIN_PASSWORD: ci_only
      LLDAP_JWT_SECRET: ci_only
      JWT_SECRET: ci_only
      GRAFANA_PASSWORD: ci_only
      ADMIN_PASSWORD: ci_only

    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Validate Compose configuration
        env:
          COMPOSE_FILE: ${{ matrix.compose }}
        run: docker compose --env-file /dev/null --profile '*' config --quiet

      # BuildKit validates Dockerfiles using the actual configured build contexts.
      # This is a static check; it does not execute RUN instructions or publish images.
      - name: Validate Docker build configuration
        env:
          COMPOSE_FILE: ${{ matrix.compose }}
        run: docker compose --env-file /dev/null --profile '*' build --check
