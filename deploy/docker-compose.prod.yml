version: '3.9'

# OpenDirectory Production Docker Compose
# Usage: docker-compose -f docker-compose.prod.yml up -d
#
# Prerequisites:
#   - Copy .env.example to .env and fill in all secrets
#   - Ensure external volumes exist: docker volume create od-postgres-prod
#
# Network topology:
#   external  - Traefik <-> internet
#   internal  - All services communicate on this isolated network
#   db        - Only data-layer containers (postgres, redis)

networks:
  external:
    driver: bridge
    name: od-external
  internal:
    driver: bridge
    internal: true
    name: od-internal
  db:
    driver: bridge
    internal: true
    name: od-db

volumes:
  postgres-data:
    name: od-postgres-prod
  redis-data:
    name: od-redis-prod
  backup-data:
    name: od-backup-prod
  traefik-certs:
    name: od-traefik-certs

# ─── Common anchors ──────────────────────────────────────────────────────────
x-service-defaults: &service-defaults
  restart: unless-stopped
  logging:
    driver: "json-file"
    options:
      max-size: "10m"
      max-file: "3"
  security_opt:
    - no-new-privileges:true

x-node-defaults: &node-defaults
  <<: *service-defaults
  image: ${IMAGE_REGISTRY:-ghcr.io/opendirectory}/${IMAGE_NAME:-app}:${IMAGE_TAG:-1.0.0}
  networks:
    - internal
    - db
  environment:
    NODE_ENV: production
    LOG_LEVEL: ${LOG_LEVEL:-info}
    POSTGRES_HOST: postgres
    POSTGRES_PORT: "5432"
    POSTGRES_DB: ${POSTGRES_DB:-opendirectory}
    POSTGRES_USER: ${POSTGRES_USER:-opendirectory}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
    REDIS_HOST: redis
    REDIS_PORT: "6379"
    REDIS_PASSWORD: ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
    SESSION_SECRET: ${SESSION_SECRET:?SESSION_SECRET must be set}

services:

  # ─── Reverse proxy ──────────────────────────────────────────────────────────
  traefik:
    <<: *service-defaults
    image: traefik:v3.0
    container_name: od-traefik
    command:
      - "--api.dashboard=false"
      - "--providers.docker=true"
      - "--providers.docker.exposedbydefault=false"
      - "--providers.docker.network=od-external"
      - "--entrypoints.web.address=:80"
      - "--entrypoints.web.http.redirections.entrypoint.to=websecure"
      - "--entrypoints.web.http.redirections.entrypoint.scheme=https"
      - "--entrypoints.websecure.address=:443"
      - "--certificatesresolvers.letsencrypt.acme.email=${ACME_EMAIL:?ACME_EMAIL must be set}"
      - "--certificatesresolvers.letsencrypt.acme.storage=/certs/acme.json"
      - "--certificatesresolvers.letsencrypt.acme.httpchallenge.entrypoint=web"
      - "--log.level=${TRAEFIK_LOG_LEVEL:-WARN}"
      - "--accesslog=true"
      - "--metrics.prometheus=true"
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock:ro
      - traefik-certs:/certs
    networks:
      - external
      - internal
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 128M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ─── PostgreSQL ──────────────────────────────────────────────────────────────
  postgres:
    <<: *service-defaults
    image: postgres:15-alpine
    container_name: od-postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-opendirectory}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set}
      POSTGRES_DB: ${POSTGRES_DB:-opendirectory}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - db
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-opendirectory} -d ${POSTGRES_DB:-opendirectory}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  # ─── Redis ───────────────────────────────────────────────────────────────────
  redis:
    <<: *service-defaults
    image: redis:7-alpine
    container_name: od-redis
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set}
      --maxmemory 256mb
      --maxmemory-policy allkeys-lru
      --save 900 1
      --save 300 10
    volumes:
      - redis-data:/data
    networks:
      - db
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 384M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ─── API Gateway ─────────────────────────────────────────────────────────────
  api-gateway:
    <<: *node-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/opendirectory}/api-gateway:${IMAGE_TAG:-1.0.0}
    container_name: od-api-gateway
    environment:
      PORT: "3000"
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
    networks:
      - internal
      - external
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    labels:
      - "traefik.enable=true"
      - "traefik.http.routers.api-gateway.rule=Host(`${DOMAIN:?DOMAIN must be set}`)"
      - "traefik.http.routers.api-gateway.entrypoints=websecure"
      - "traefik.http.routers.api-gateway.tls.certresolver=letsencrypt"
      - "traefik.http.services.api-gateway.loadbalancer.server.port=3000"
      - "traefik.http.routers.api-gateway.middlewares=security-headers@docker"
      # Security headers middleware
      - "traefik.http.middlewares.security-headers.headers.stsSeconds=31536000"
      - "traefik.http.middlewares.security-headers.headers.stsIncludeSubdomains=true"
      - "traefik.http.middlewares.security-headers.headers.forceSTSHeader=true"
      - "traefik.http.middlewares.security-headers.headers.contentTypeNosniff=true"
      - "traefik.http.middlewares.security-headers.headers.browserXssFilter=true"
      - "traefik.http.middlewares.security-headers.headers.referrerPolicy=strict-origin-when-cross-origin"
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

  # ─── Authentication Service ──────────────────────────────────────────────────
  auth-service:
    <<: *node-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/opendirectory}/authentication-service:${IMAGE_TAG:-1.0.0}
    container_name: od-auth-service
    environment:
      PORT: "3001"
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      SESSION_SECRET: ${SESSION_SECRET:?}
      LLDAP_URL: ${LLDAP_URL:-http://lldap:17170}
      LLDAP_JWT_SECRET: ${LLDAP_JWT_SECRET:?LLDAP_JWT_SECRET must be set}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

  # ─── Identity Service ─────────────────────────────────────────────────────────
  identity-service:
    <<: *node-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/opendirectory}/identity-service:${IMAGE_TAG:-1.0.0}
    container_name: od-identity-service
    environment:
      PORT: "3002"
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.2"
          memory: 128M

  # ─── Device Service ───────────────────────────────────────────────────────────
  device-service:
    <<: *node-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/opendirectory}/device-service:${IMAGE_TAG:-1.0.0}
    container_name: od-device-service
    environment:
      PORT: "3003"
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ─── Policy Service ───────────────────────────────────────────────────────────
  policy-service:
    <<: *node-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/opendirectory}/policy-service:${IMAGE_TAG:-1.0.0}
    container_name: od-policy-service
    environment:
      PORT: "3004"
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ─── Monitoring Service ───────────────────────────────────────────────────────
  monitoring-service:
    <<: *node-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/opendirectory}/monitoring-service:${IMAGE_TAG:-1.0.0}
    container_name: od-monitoring-service
    environment:
      PORT: "3005"
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3005/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.1"
          memory: 128M

  # ─── MDM Service ─────────────────────────────────────────────────────────────
  mdm-service:
    <<: *node-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/opendirectory}/apple-mdm:${IMAGE_TAG:-1.0.0}
    container_name: od-mdm-service
    environment:
      PORT: "3006"
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
      APPLE_MDM_PUSH_CERT: ${APPLE_MDM_PUSH_CERT:-}
      APPLE_MDM_PUSH_KEY: ${APPLE_MDM_PUSH_KEY:-}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  # ─── Backup Service ───────────────────────────────────────────────────────────
  backup-service:
    <<: *node-defaults
    image: ${IMAGE_REGISTRY:-ghcr.io/opendirectory}/backup-service:${IMAGE_TAG:-1.0.0}
    container_name: od-backup-service
    environment:
      PORT: "3011"
      NODE_ENV: production
      POSTGRES_HOST: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?}
      REDIS_PASSWORD: ${REDIS_PASSWORD:?}
      JWT_SECRET: ${JWT_SECRET:?}
    volumes:
      - backup-data:/backups
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3011/health"]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 20s
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
