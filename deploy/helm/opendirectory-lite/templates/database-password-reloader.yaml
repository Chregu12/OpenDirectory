{{- if and .Values.externalSecrets.enabled .Values.externalSecrets.databasePasswordRotation.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-database-reloader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendirectory-lite.labels" . | nindent 4 }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ .Release.Name }}-database-reloader
  namespace: {{ .Release.Namespace }}
data:
  passwordHash: ""
  reloader.py: |
{{ .Files.Get "files/reload-db-password.py" | indent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-database-reloader
  namespace: {{ .Release.Namespace }}
rules:
  - apiGroups: [""]
    resources: ["secrets"]
    resourceNames: [{{ .Values.secrets.databaseName | quote }}]
    verbs: ["get"]
  - apiGroups: [""]
    resources: ["configmaps"]
    resourceNames: [{{ printf "%s-database-reloader" .Release.Name | quote }}]
    verbs: ["get", "patch"]
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-database-reloader
  namespace: {{ .Release.Namespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-database-reloader
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-database-reloader
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ .Release.Name }}-database-reloader
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendirectory-lite.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.externalSecrets.databasePasswordRotation.reloaderSchedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 1
  failedJobsHistoryLimit: 2
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        spec:
          serviceAccountName: {{ .Release.Name }}-database-reloader
          restartPolicy: Never
          containers:
            - name: rollout-on-password-change
              image: {{ .Values.externalSecrets.databasePasswordRotation.reloaderImage | quote }}
              imagePullPolicy: IfNotPresent
              command: ["python", "/scripts/reload-db-password.py"]
              env:
                - name: WATCH_NAMESPACE
                  valueFrom:
                    fieldRef:
                      fieldPath: metadata.namespace
                - name: DATABASE_SECRET_NAME
                  value: {{ .Values.secrets.databaseName | quote }}
                - name: RELOADER_CONFIGMAP_NAME
                  value: {{ printf "%s-database-reloader" .Release.Name | quote }}
                - name: DEPLOYMENT_SELECTOR
                  value: "app.kubernetes.io/instance={{ .Release.Name }},opendirectory.heusser.local/uses-database-password=true"
              volumeMounts:
                - name: script
                  mountPath: /scripts
                  readOnly: true
          volumes:
            - name: script
              configMap:
                name: {{ .Release.Name }}-database-reloader
                defaultMode: 0444
{{- end }}
