{{- if .Values.externalSecrets.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendirectory-lite.labels" . | nindent 4 }}
{{- if .Values.externalSecrets.postgresAdmin.enabled }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.postgresAdmin.serviceAccountName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendirectory-lite.labels" . | nindent 4 }}
{{- end }}
{{- if .Values.externalSecrets.runtime }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $.Values.secrets.runtimeName }}
  namespace: {{ $.Release.Namespace }}
  labels:
    {{- include "opendirectory-lite.labels" $ | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ $.Values.secrets.runtimeName }}
    creationPolicy: Owner
  data:
    {{- range $key, $source := $.Values.externalSecrets.runtime }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $source.path | quote }}
        property: {{ $source.property | quote }}
    {{- end }}
{{- end }}
{{- if .Values.externalSecrets.files }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.filesName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendirectory-lite.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.filesName }}
    creationPolicy: Owner
  data:
    {{- range $key, $source := .Values.externalSecrets.files }}
    - secretKey: {{ $key | quote }}
      remoteRef:
        key: {{ $source.path | quote }}
        property: {{ $source.property | quote }}
    {{- end }}
{{- end }}
{{- if .Values.externalSecrets.postgresAdmin.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.postgresAdminName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendirectory-lite.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.postgresAdmin.storeName }}
    kind: ClusterSecretStore
  target:
    name: {{ .Values.secrets.postgresAdminName }}
    creationPolicy: Owner
  data:
    - secretKey: {{ .Values.externalSecrets.postgresAdmin.property | quote }}
      remoteRef:
        key: {{ .Values.externalSecrets.postgresAdmin.path | quote }}
        property: {{ .Values.externalSecrets.postgresAdmin.property | quote }}
{{- end }}
{{- if .Values.externalSecrets.harborPullSecret.enabled }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: harbor-opendirectory
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendirectory-lite.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  secretStoreRef:
    name: {{ .Values.externalSecrets.storeName }}
    kind: ClusterSecretStore
  target:
    name: harbor-opendirectory
    creationPolicy: Owner
    template:
      type: kubernetes.io/dockerconfigjson
  data:
    - secretKey: .dockerconfigjson
      remoteRef:
        key: {{ .Values.externalSecrets.harborPullSecret.path | quote }}
        property: {{ .Values.externalSecrets.harborPullSecret.property | quote }}
{{- end }}
{{- if .Values.externalSecrets.databasePasswordRotation.enabled }}
{{- $dbPassword := "{{ .password }}" }}
---
apiVersion: generators.external-secrets.io/v1alpha1
kind: VaultDynamicSecret
metadata:
  name: {{ .Release.Name }}-database-password
  namespace: {{ .Release.Namespace }}
spec:
  path: database/static-creds/opendirectory
  method: GET
  resultType: Data
  provider:
    server: https://openbao-active.openbao.svc.cluster.local:8200
    caProvider:
      type: ConfigMap
      name: openbao-ca
      key: ca.crt
    auth:
      kubernetes:
        mountPath: kubernetes
        role: {{ .Values.externalSecrets.role | quote }}
        serviceAccountRef:
          name: {{ .Values.externalSecrets.serviceAccountName }}
          audiences: [openbao]
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.secrets.databaseName }}
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "opendirectory-lite.labels" . | nindent 4 }}
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval | quote }}
  target:
    name: {{ .Values.secrets.databaseName }}
    creationPolicy: Owner
    template:
      engineVersion: v2
      mergePolicy: Replace
      data:
        postgres-app-initial-password: {{ $dbPassword | quote }}
        identity-database-url: {{ printf "postgresql://opendirectory:%s@%s-postgres.%s.svc.cluster.local:5432/identity" $dbPassword .Release.Name .Release.Namespace | quote }}
        auth-database-url: {{ printf "postgresql://opendirectory:%s@%s-postgres.%s.svc.cluster.local:5432/auth" $dbPassword .Release.Name .Release.Namespace | quote }}
        policy-database-url: {{ printf "postgresql://opendirectory:%s@%s-postgres.%s.svc.cluster.local:5432/policy" $dbPassword .Release.Name .Release.Namespace | quote }}
        oauth-database-url: {{ printf "postgresql://opendirectory:%s@%s-postgres.%s.svc.cluster.local:5432/oauth" $dbPassword .Release.Name .Release.Namespace | quote }}
        api-database-url: {{ printf "postgresql://opendirectory:%s@%s-postgres.%s.svc.cluster.local:5432/api" $dbPassword .Release.Name .Release.Namespace | quote }}
        license-fulfillment-database-url: {{ printf "postgresql://opendirectory:%s@%s-postgres.%s.svc.cluster.local:5432/license_fulfillment" $dbPassword .Release.Name .Release.Namespace | quote }}
        license-capacity-database-url: {{ printf "postgresql://opendirectory:%s@%s-postgres.%s.svc.cluster.local:5432/license_capacity" $dbPassword .Release.Name .Release.Namespace | quote }}
  dataFrom:
    - sourceRef:
        generatorRef:
          apiVersion: generators.external-secrets.io/v1alpha1
          kind: VaultDynamicSecret
          name: {{ .Release.Name }}-database-password
{{- end }}
{{- end }}
