{{- if .Values.grafanaCredentials.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Release.Name }}-grafana-reader
  namespace: {{ .Release.Namespace }}
automountServiceAccountToken: false
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ .Release.Name }}-grafana-reader
  namespace: {{ .Values.grafanaCredentials.sourceNamespace }}
rules:
  - apiGroups: [""]
    resources: [secrets]
    resourceNames: [{{ .Values.grafanaCredentials.sourceSecret | quote }}]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ .Release.Name }}-grafana-reader
  namespace: {{ .Values.grafanaCredentials.sourceNamespace }}
subjects:
  - kind: ServiceAccount
    name: {{ .Release.Name }}-grafana-reader
    namespace: {{ .Release.Namespace }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ .Release.Name }}-grafana-reader
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Release.Namespace }}
spec:
  provider:
    kubernetes:
      remoteNamespace: {{ .Values.grafanaCredentials.sourceNamespace }}
      server:
        url: https://kubernetes.default.svc
        caProvider:
          type: ConfigMap
          name: kube-root-ca.crt
          key: ca.crt
      auth:
        serviceAccount:
          name: {{ .Release.Name }}-grafana-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-grafana
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 5m
  secretStoreRef:
    kind: SecretStore
    name: {{ .Release.Name }}-grafana
  target:
    name: {{ .Release.Name }}-grafana
    creationPolicy: Owner
  data:
    - secretKey: admin-user
      remoteRef:
        key: {{ .Values.grafanaCredentials.sourceSecret }}
        property: admin-user
    - secretKey: admin-password
      remoteRef:
        key: {{ .Values.grafanaCredentials.sourceSecret }}
        property: admin-password
{{- end }}
