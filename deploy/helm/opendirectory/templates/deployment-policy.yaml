apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opendirectory.fullname" . }}-policy
  namespace: {{ include "opendirectory.namespace" . }}
  labels:
    {{- include "opendirectory.labels" . | nindent 4 }}
    app.kubernetes.io/component: policy
spec:
  replicas: {{ .Values.policy.replicaCount }}
  selector:
    matchLabels:
      {{- include "opendirectory.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: policy
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  template:
    metadata:
      labels:
        {{- include "opendirectory.labels" . | nindent 8 }}
        app.kubernetes.io/component: policy
      annotations:
        {{- include "opendirectory.prometheusAnnotations" . | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "opendirectory.serviceAccountName" . }}
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      {{- include "opendirectory.podAntiAffinity" . | nindent 6 }}
      containers:
        - name: policy
          image: {{ include "opendirectory.image" (dict "root" . "name" .Values.policy.image.name) }}
          imagePullPolicy: {{ .Values.global.image.pullPolicy }}
          securityContext:
            {{- toYaml .Values.securityContext | nindent 12 }}
          ports:
            - name: http
              containerPort: {{ .Values.policy.service.appPort }}
              protocol: TCP
            - name: metrics
              containerPort: 9090
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "opendirectory.fullname" . }}-config
            - secretRef:
                name: {{ include "opendirectory.fullname" . }}-secret
          env:
            - name: PORT
              value: {{ .Values.policy.service.appPort | quote }}
            - name: RABBITMQ_URL
              value: "amqp://{{ .Values.rabbitmq.auth.username }}:{{ .Values.rabbitmq.auth.password }}@rabbitmq:5672/"
          livenessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 15
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            {{- toYaml .Values.policy.resources | nindent 12 }}
