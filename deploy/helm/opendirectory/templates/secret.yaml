apiVersion: v1
kind: Secret
metadata:
  name: {{ include "opendirectory.fullname" . }}-secret
  namespace: {{ include "opendirectory.namespace" . }}
  labels:
    {{- include "opendirectory.labels" . | nindent 4 }}
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
type: Opaque
# NOTE: In production, manage secrets with Vault, Sealed Secrets, or External Secrets Operator.
# The values below are base64-encoded placeholders — replace before deploying.
data:
  POSTGRES_PASSWORD: {{ "opendirectory-change-me" | b64enc | quote }}
  JWT_SECRET: {{ "jwt-secret-change-me-in-production" | b64enc | quote }}
  SESSION_SECRET: {{ "session-secret-change-me-in-production" | b64enc | quote }}
  LLDAP_JWT_SECRET: {{ "lldap-jwt-secret-change-me" | b64enc | quote }}
  ENCRYPTION_KEY: {{ "encryption-key-32-chars-change-me!" | b64enc | quote }}
