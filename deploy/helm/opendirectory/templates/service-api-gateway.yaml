apiVersion: v1
kind: Service
metadata:
  name: {{ include "opendirectory.fullname" . }}-api-gateway
  namespace: {{ include "opendirectory.namespace" . }}
  labels:
    {{- include "opendirectory.labels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
spec:
  type: {{ .Values.apiGateway.service.type }}
  ports:
    - port: {{ .Values.apiGateway.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "opendirectory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: api-gateway
