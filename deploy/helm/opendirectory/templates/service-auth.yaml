apiVersion: v1
kind: Service
metadata:
  name: {{ include "opendirectory.fullname" . }}-auth
  namespace: {{ include "opendirectory.namespace" . }}
  labels:
    {{- include "opendirectory.labels" . | nindent 4 }}
    app.kubernetes.io/component: auth
spec:
  type: {{ .Values.auth.service.type }}
  ports:
    - port: {{ .Values.auth.service.port }}
      targetPort: http
      protocol: TCP
      name: http
    - name: grpc
      port: {{ .Values.auth.service.grpcPort }}
      targetPort: grpc
      protocol: TCP
  selector:
    {{- include "opendirectory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: auth
