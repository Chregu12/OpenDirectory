apiVersion: v1
kind: Service
metadata:
  name: license-management
  namespace: {{ include "opendirectory.namespace" . }}
  labels:
    {{- include "opendirectory.labels" . | nindent 4 }}
    app.kubernetes.io/component: license
spec:
  type: {{ .Values.licenseManagement.service.type }}
  ports:
    - port: {{ .Values.licenseManagement.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "opendirectory.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: license
