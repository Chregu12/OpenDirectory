# Default values for OpenDirectory Helm chart.
# Override with values.prod.yaml for production deployments.

# ─── Global ───────────────────────────────────────────────────────────────────
global:
  image:
    registry: ghcr.io/opendirectory
    tag: "1.0.0"
    pullPolicy: IfNotPresent
  imagePullSecrets: []
  nameOverride: ""
  fullnameOverride: ""

# ─── Namespace ────────────────────────────────────────────────────────────────
namespace:
  create: true
  name: opendirectory

# ─── API Gateway ──────────────────────────────────────────────────────────────
apiGateway:
  replicaCount: 2
  image:
    name: api-gateway
  service:
    type: ClusterIP
    port: 80
    appPort: 3000
    grpcPort: 50051
  resources:
    requests:
      cpu: "100m"
      memory: "128Mi"
    limits:
      cpu: "500m"
      memory: "512Mi"
  env:
    NODE_ENV: production

