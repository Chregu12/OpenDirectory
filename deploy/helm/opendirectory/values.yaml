# ─── RabbitMQ ─────────────────────────────────────────────────────────────────
rabbitmq:
  enabled: true
  storageSize: "5Gi"
  auth:
    username: opendirectory
    password: changeme  # override in production

# ─── Event Bus ───────────────────────────────────────────────────────────────
eventBus:
  transport: rabbitmq        # rabbitmq | grpc | memory — overrideable per-env
  grpcAddress: "event-bus:50050"
  grpcServerPort: 50050
  exchange: "opendirectory.events"
  prefetch: 10
  reconnectDelayMs: 2000
  replicaCount: 1
  backendTransport: rabbitmq
  image:
    name: event-bus-service
  resources:
    requests:
      cpu: "50m"
      memory: "64Mi"
    limits:
      cpu: "200m"
      memory: "256Mi"

# ─── Ingress ──────────────────────────────────────────────────────────────────
ingress:
  enabled: true
  className: nginx
  hostname: opendirectory.local
  tls:
    enabled: false
    secretName: opendirectory-tls
  annotations: {}

# ─── PostgreSQL ───────────────────────────────────────────────────────────────
postgresql:
  enabled: true
  image: postgres:15-alpine
  database: opendirectory
  username: opendirectory
  storageSize: "10Gi"
  storageClass: ""
  service:
    port: 5432
  resources:
    requests:
      cpu: "100m"
      memory: "256Mi"
    limits:
      cpu: "500m"
      memory: "1Gi"

# ─── Persistence ─────────────────────────────────────────────────────────────
persistence:
  enabled: true
  storageClass: ""
  backupStorageSize: "50Gi"

# ─── Autoscaling ─────────────────────────────────────────────────────────────
autoscaling:
  enabled: false
  minReplicas: 1
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70
  targetMemoryUtilizationPercentage: 80

# ─── Pod Disruption Budget ───────────────────────────────────────────────────
podDisruptionBudget:
  enabled: true
  minAvailable: 1

# ─── Network Policies ────────────────────────────────────────────────────────
networkPolicy:
  enabled: true

# ─── RBAC ─────────────────────────────────────────────────────────────────────
rbac:
  create: true
  serviceAccount:
    create: true
    name: ""

# ─── Monitoring / Prometheus ─────────────────────────────────────────────────
prometheusAnnotations:
  enabled: true
  path: /metrics
  port: "metrics"
  scrape: "true"

# ─── Pod Security / Affinity ─────────────────────────────────────────────────
podAnnotations: {}
podSecurityContext:
  runAsNonRoot: true
  runAsUser: 1000
  fsGroup: 1000

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: false
  capabilities:
    drop:
      - ALL

nodeSelector: {}
tolerations: []

# Prefer spreading pods across nodes
affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchExpressions:
              - key: app.kubernetes.io/name
                operator: In
                values:
                  - opendirectory
          topologyKey: kubernetes.io/hostname
