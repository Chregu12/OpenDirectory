apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-harbor-rotation-api
spec:
  conditions:
    - namespaces:
        - opendirectory
  provider:
    vault:
      server: https://openbao-active.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: openbao-server-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: opendirectory-harbor-api-reader
          serviceAccountRef:
            name: opendirectory-harbor-api-reader
            namespace: opendirectory
            audiences:
              - openbao
