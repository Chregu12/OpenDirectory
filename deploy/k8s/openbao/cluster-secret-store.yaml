apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao
spec:
  conditions:
    - namespaces:
        - opendirectory
  provider:
    vault:
      server: https://openbao-active.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: openbao-server-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: opendirectory-eso
          serviceAccountRef:
            name: opendirectory-secret-reader
            namespace: opendirectory
            audiences:
              - openbao
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: openbao-postgres-admin
spec:
  conditions:
    - namespaces:
        - opendirectory
  provider:
    vault:
      server: https://openbao-active.openbao.svc.cluster.local:8200
      path: secret
      version: v2
      caProvider:
        type: Secret
        name: openbao-server-tls
        namespace: openbao
        key: ca.crt
      auth:
        kubernetes:
          mountPath: kubernetes
          role: opendirectory-postgres-admin
          serviceAccountRef:
            name: opendirectory-postgres-admin-reader
            namespace: opendirectory
            audiences:
              - openbao
