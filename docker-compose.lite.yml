# OpenDirectory - Modular Edition
# Ziel: <= 4 GB RAM | Module per Docker Profiles aktivierbar
#
# Kern (~2.0 GB):  PostgreSQL + Redis + LLDAP + Identity + Auth + Device + Policy + API + Frontend
# Module (optional, je ~128-256 MB):
#   - network:    DNS/DHCP/SMB/NFS Netzwerk-Infrastruktur
#   - printers:   Drucker-Management mit CUPS
#   - monitoring:  Grafana + Prometheus
#   - security:   Security Scanner + Auto-Remediation
#   - lifecycle:  Device Lifecycle + Graph Explorer + Policy Simulator
#
# Beispiele:
#   Nur Kern:              docker compose -f docker-compose.lite.yml up -d
#   Kern + Netzwerk:       docker compose -f docker-compose.lite.yml --profile network up -d
#   Kern + Drucker + Netz: docker compose -f docker-compose.lite.yml --profile network --profile printers up -d
#   Alles:                 docker compose -f docker-compose.lite.yml --profile network --profile printers --profile monitoring --profile security --profile lifecycle up -d
#
# Oder via Wizard:         ./quick-setup.sh

version: '3.9'

services:
  # =====================================================
  # KERN - Immer aktiv (~2.0 GB RAM)
  # =====================================================

  postgres:
    image: postgres:15-alpine
    container_name: od-postgres
    environment:
      POSTGRES_USER: opendirectory
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      # DB-per-service provisioning is driven entirely by init-databases.sh's
      # CREATE DATABASE loop (mounted below) — that script does NOT read a
      # POSTGRES_MULTIPLE_DATABASES variable, so one is intentionally not set
      # here. To add a database, edit infrastructure/postgres/init-databases.sh.
    volumes:
      - postgres-data:/var/lib/postgresql/data
      # Previously missing here (present in docker-compose.yml): without this
      # mount, only the default 'opendirectory' maintenance DB existed and
      # identity-service/auth-service/policy-service/api-backend (and the
      # network/printers modules) all failed to connect to their own DBs.
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    networks:
      - opendirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendirectory"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: od-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env} --maxmemory 64mb --maxmemory-policy allkeys-lru --save ""
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - opendirectory
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 96M
    restart: unless-stopped

  mongodb:
    image: mongo:6
    container_name: od-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: opendirectory
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}
      MONGO_INITDB_DATABASE: devices
    command: mongod --wiredTigerCacheSizeGB 0.25
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - opendirectory
    deploy:
      resources:
        limits:
          memory: 384M
    restart: unless-stopped

  lldap:
    image: nitnelave/lldap:stable
    container_name: od-lldap
    environment:
      - LLDAP_JWT_SECRET=${LLDAP_JWT_SECRET:?LLDAP_JWT_SECRET must be set in .env}
      - LLDAP_LDAP_BASE_DN=dc=opendirectory,dc=local
      - LLDAP_LDAP_USER_DN=admin
      - LLDAP_LDAP_USER_PASS=${LLDAP_ADMIN_PASSWORD:?LLDAP_ADMIN_PASSWORD must be set in .env}
    volumes:
      - lldap-data:/data
    ports:
      - "3890:3890"
      - "17170:17170"
    networks:
      - opendirectory
    deploy:
      resources:
        limits:
          memory: 64M
    restart: unless-stopped

  quick-actions:
    profiles: [delegated-orchestration]
    build:
      context: .
      dockerfile: services/platform/quick-actions/Dockerfile
    environment:
      - NODE_ENV=production
      - PORT=3950
      - OIDC_ISSUER=${OAUTH_ISSUER:-https://opendirectory.local}
      - OIDC_AUDIENCE=${OAUTH_API_AUDIENCE:-opendirectory-api}
      - JWKS_URI=http://oauth-provider:3010/.well-known/jwks.json
      - OIDC_ACCESS_STATE_URL=http://oauth-provider:3010/oauth/access-state
      - AUTH_SERVICE_URL=${QUICK_ACTIONS_AUTH_URL:-http://auth-service:3002}
      - DIRECTORY_SERVICE_URL=${QUICK_ACTIONS_DIRECTORY_URL:-http://enterprise-directory}
      - KERBEROS_SERVICE_URL=${QUICK_ACTIONS_KERBEROS_URL:-http://kerberos-kdc:3013}
      - SAMBA_SERVICE_URL=${QUICK_ACTIONS_SAMBA_URL:-http://samba-ad-dc:3010}
      - DEVICE_SERVICE_URL=${QUICK_ACTIONS_DEVICE_URL:-http://device-service:3003}
      - POLICY_SERVICE_URL=${QUICK_ACTIONS_POLICY_URL:-http://policy-service:3004}
      - PIM_SERVICE_URL=${QUICK_ACTIONS_PIM_URL:-http://conditional-access}
      - MDM_SERVICE_URL=${QUICK_ACTIONS_MDM_URL:-http://mobile-management}
      - APP_STORE_SERVICE_URL=${QUICK_ACTIONS_APP_STORE_URL:-http://app-store}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
    ports:
      - "127.0.0.1:${QUICK_ACTIONS_PORT:-3950}:3950"
    networks: [opendirectory]
    depends_on: [oauth-provider, identity-service]
    read_only: true
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    restart: unless-stopped

  identity-service:
    build:
      context: .
      dockerfile: services/core/identity-service/Dockerfile
    container_name: od-identity-service
    environment:
      - IDENTITY_DEMO_MODE=${IDENTITY_DEMO_MODE:-false}
      - OIDC_ISSUER=${OAUTH_ISSUER:-https://opendirectory.local}
      - OIDC_AUDIENCE=${OAUTH_API_AUDIENCE:-opendirectory-api}
      - JWKS_URI=http://oauth-provider:3010/.well-known/jwks.json
      - OIDC_ACCESS_STATE_URL=http://oauth-provider:3010/oauth/access-state
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=--max-old-space-size=128
      - PORT=3001
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD}@postgres/identity
      - POLICY_SERVICE_URL=http://policy-service:3004
      - OIDC_TENANT_STATE_URL=http://oauth-provider:3010/oauth/tenant-state
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3001:3001"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped

  auth-service:
    build:
      context: .
      dockerfile: services/core/authentication-service/Dockerfile
    container_name: od-auth-service
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=--max-old-space-size=128
      - PORT=3002
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD}@postgres/auth
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - OIDC_ISSUER=${OAUTH_ISSUER:-https://opendirectory.local}
      - JWKS_URI=http://oauth-provider:3010/.well-known/jwks.json
      - IDENTITY_SERVICE_URL=http://identity-service:3001
      - LDAP_URL=ldap://lldap:3890
    ports:
      - "3002:3002"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped

  oauth-provider:
    build:
      context: .
      dockerfile: services/core/oauth-provider/Dockerfile
    user: "${OAUTH_SERVICE_UID:-1000}:${OAUTH_SERVICE_GID:-1000}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - OAUTH_PROVIDER_PORT=3010
      - AUTH_SERVICE_URL=http://auth-service:3002
      - OAUTH_ISSUER=${OAUTH_ISSUER:-https://opendirectory.local}
      - OAUTH_API_AUDIENCE=${OAUTH_API_AUDIENCE:-opendirectory-api}
      - OAUTH_IDENTITY_AUTHORITY_URL=${OAUTH_IDENTITY_AUTHORITY_URL:-http://identity-service:3001/internal/identity/authorization-state}
      - COMPANY_REGISTRATION_ENABLED=${COMPANY_REGISTRATION_ENABLED:-false}
      - COMPANY_ACTIVATION_ENABLED=${COMPANY_ACTIVATION_ENABLED:-false}
      - COMPANY_CONSOLE_CLIENT_ID=${COMPANY_CONSOLE_CLIENT_ID:-web-app}
      - OAUTH_POLICY_SOURCE_URL=${OAUTH_POLICY_SOURCE_URL:-http://policy-service:3004}
      - OAUTH_SIGNING_KEY_FILE=/run/opendirectory/oauth-signing.pem
      - OAUTH_MFA_KEY_FILE=/run/opendirectory/mfa-encryption.key
      - OAUTH_VERIFICATION_JWKS_FILE=/run/opendirectory/oauth-verification.jwks.json
      - OAUTH_EPHEMERAL_SIGNING_KEYS=false
      - OAUTH_WEB_CLIENT_ID=${BROWSER_AUTH_CLIENT_ID:-web-app}
      - OAUTH_WEB_CLIENT_SECRET_FILE=/run/opendirectory/web-client.secret
      - OAUTH_WEB_REDIRECT_URIS=${OAUTH_WEB_REDIRECT_URIS:-["https://opendirectory.local/auth/callback"]}
      - OAUTH_WEB_ALLOW_HTTP_LOOPBACK=${BROWSER_AUTH_ALLOW_HTTP_LOOPBACK:-false}
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD}@postgres/oauth
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    volumes:
      - type: bind
        source: ${OAUTH_SIGNING_KEY_HOST_FILE:-./secrets/oauth-signing/active.pem}
        target: /run/opendirectory/oauth-signing.pem
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OAUTH_MFA_KEY_HOST_FILE:-./secrets/oauth-signing/mfa-encryption.key}
        target: /run/opendirectory/mfa-encryption.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OAUTH_VERIFICATION_JWKS_HOST_FILE:-./secrets/oauth-signing/verification.jwks.json}
        target: /run/opendirectory/oauth-verification.jwks.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${OAUTH_WEB_CLIENT_SECRET_HOST_FILE:-./secrets/oauth-signing/web-client.secret}
        target: /run/opendirectory/web-client.secret
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "127.0.0.1:3015:3010"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      auth-service:
        condition: service_started
    restart: unless-stopped

  device-service:
    build:
      context: .
      dockerfile: services/core/device-service/Dockerfile
    container_name: od-device-service
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=--max-old-space-size=128
      - PORT=3003
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=devices
      - DB_USER=opendirectory
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      - OIDC_ISSUER=${OAUTH_ISSUER:-https://opendirectory.local}
      - JWKS_URI=http://oauth-provider:3010/.well-known/jwks.json
      - OIDC_ACCESS_STATE_URL=http://oauth-provider:3010/oauth/access-state
      - IDENTITY_SERVICE_URL=http://identity-service:3001
    ports:
      - "3003:3003"
    networks:
      - opendirectory
    depends_on:
      - postgres
    volumes:
      # FileDriverRepository / FileHardwareReportRepository default paths —
      # named volumes so uploaded drivers/hardware reports survive
      # container recreation (previously unmounted -> data loss).
      - device-drivers:/var/lib/opendirectory/device-drivers
      - device-hardware:/var/lib/opendirectory/device-hardware
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped

  policy-service:
    build:
      context: .
      dockerfile: services/core/policy-service/Dockerfile
    container_name: od-policy-service
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=--max-old-space-size=128
      - PORT=3004
      - LICENSE_DEMO_MODE=${LICENSE_DEMO_MODE:-false}
      - IDENTITY_SERVICE_URL=http://identity-service:3001
      - LICENSE_GROUP_READ_TOKEN=${LICENSE_GROUP_READ_TOKEN:-}
      - LICENSE_SOURCE_CONFIG_FILE=${LICENSE_SOURCE_CONFIG_FILE:-}
      - LICENSE_USER_READ_TOKEN=${LICENSE_USER_READ_TOKEN:-}
      - OIDC_ISSUER=${OAUTH_ISSUER:-https://opendirectory.local}
      - OIDC_AUDIENCE=${OAUTH_API_AUDIENCE:-opendirectory-api}
      - JWKS_URI=http://oauth-provider:3010/.well-known/jwks.json
      - OIDC_ACCESS_STATE_URL=http://oauth-provider:3010/oauth/access-state
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD}@postgres/policy
      - OAUTH_PROVIDER_URL=http://oauth-provider:3010
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3004:3004"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped

  license-fulfillment:
    profiles: [license-fulfillment]
    build:
      context: .
      dockerfile: services/core/policy-service/Dockerfile
    user: "${LICENSE_FULFILLMENT_UID:-1000}:${LICENSE_FULFILLMENT_GID:-1000}"
    command: [node, scripts/license-fulfillment-worker.js]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${LICENSE_FULFILLMENT_DATABASE_URL:-}
      - PG_POOL_MAX=4
      - LICENSE_FULFILLMENT_CONFIG_FILE=/run/opendirectory/license-fulfillment.json
    volumes:
      - type: bind
        source: ${LICENSE_FULFILLMENT_CONFIG_HOST_FILE:-./secrets/license-fulfillment.json}
        target: /run/opendirectory/license-fulfillment.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    networks: [opendirectory]
    depends_on:
      postgres:
        condition: service_healthy
      policy-service:
        condition: service_started
    restart: unless-stopped

  license-capacity:
    profiles: [license-capacity]
    build:
      context: .
      dockerfile: services/core/policy-service/Dockerfile
    user: "${LICENSE_CAPACITY_UID:-1000}:${LICENSE_CAPACITY_GID:-1000}"
    command: [node, scripts/license-capacity-observer.js]
    environment:
      - NODE_ENV=production
      - DATABASE_URL=${LICENSE_CAPACITY_DATABASE_URL:-}
      - PG_POOL_MAX=3
      - LICENSE_CAPACITY_CONFIG_FILE=/run/opendirectory/license-capacity.json
    volumes:
      - type: bind
        source: ${LICENSE_CAPACITY_CONFIG_HOST_FILE:-./secrets/license-capacity.json}
        target: /run/opendirectory/license-capacity.json
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    healthcheck:
      disable: true
    networks: [opendirectory]
    depends_on:
      postgres:
        condition: service_healthy
      policy-service:
        condition: service_started
    restart: unless-stopped

  license-management:
    profiles: [license-compat]
    build:
      context: ./services/core/license-management
    environment:
      - NODE_ENV=production
      - LICENSE_SERVICE_PORT=3018
      - POLICY_SERVICE_URL=http://policy-service:3004
      - CORS_ORIGINS=${CORS_ORIGIN:-http://localhost:3000}
    ports:
      - "127.0.0.1:3018:3018"
    networks:
      - opendirectory
    depends_on:
      - policy-service
    restart: unless-stopped

  api-gateway:
    build:
      context: ./services/platform/api-gateway
      dockerfile: Dockerfile
    container_name: od-api-gateway
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=--max-old-space-size=128
      - API_GATEWAY_PORT=3000
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - REDIS_PASSWORD=${REDIS_PASSWORD}
      - JWT_SECRET=${JWT_SECRET}
      - LOG_LEVEL=warn
    ports:
      - "3010:3000"
      - "3011:3001"
    networks:
      - opendirectory
    depends_on:
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped

  api-backend:
    build:
      context: ./services/platform/api-backend
      dockerfile: Dockerfile
    container_name: od-api-backend
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=--max-old-space-size=128
      - PORT=8080
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET}
      # DB-per-service: point at api-backend's own 'api' DB, consistent with
      # docker-compose.yml (full). Previously this aimed at '/identity', the
      # identity-service's DB — cross-service coupling. api-backend performs no
      # SQL today, so this is a config-drift fix, not a behavioural one.
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD}@postgres/api
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - DEVICE_SERVICE_URL=http://device-service:3003
    ports:
      - "8080:8080"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      identity-service:
        condition: service_started
      auth-service:
        condition: service_started
      device-service:
        condition: service_started
      policy-service:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped

  web-app:
    build:
      context: .
      dockerfile: frontend/web-app/Dockerfile
    container_name: od-web-app
    user: "${WEB_SERVICE_UID:-1001}:${WEB_SERVICE_GID:-1001}"
    environment:
      - BROWSER_AUTH_ORIGIN=${BROWSER_AUTH_ORIGIN:-https://opendirectory.local}
      - BROWSER_AUTH_ISSUER=${OAUTH_ISSUER:-https://opendirectory.local}
      - BROWSER_AUTH_PUBLIC_URL=${BROWSER_AUTH_PUBLIC_URL:-https://opendirectory.local}
      - BROWSER_AUTH_INTERNAL_URL=http://oauth-provider:3010
      - BROWSER_AUTH_API_AUDIENCE=${OAUTH_API_AUDIENCE:-opendirectory-api}
      - BROWSER_AUTH_CLIENT_ID=${BROWSER_AUTH_CLIENT_ID:-web-app}
      - BROWSER_AUTH_KEY_FILE=/run/opendirectory/browser-cookie.key
      - BROWSER_AUTH_CLIENT_SECRET_FILE=/run/opendirectory/web-client.secret
      - BROWSER_AUTH_ALLOW_HTTP_LOOPBACK=${BROWSER_AUTH_ALLOW_HTTP_LOOPBACK:-false}
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - CORE_GATEWAY_URL=${CORE_GATEWAY_URL:-http://core-gateway:8080}
      - POLICY_SERVICE_URL=http://policy-service:3004
      - LICENSE_ADAPTER_URL=http://license-management:3018
    volumes:
      - type: bind
        source: ${BROWSER_AUTH_KEY_HOST_FILE:-./secrets/browser-auth/cookie.key}
        target: /run/opendirectory/browser-cookie.key
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${BROWSER_AUTH_CLIENT_SECRET_HOST_FILE:-./secrets/browser-auth/client.secret}
        target: /run/opendirectory/web-client.secret
        read_only: true
        bind:
          create_host_path: false
    ports:
      - "3000:3000"
    networks:
      - opendirectory
    depends_on:
      - api-backend
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped

  # =====================================================
  # MODUL: network (~256 MB)
  # DNS, DHCP, SMB/NFS File Shares, Network Discovery
  # =====================================================

  network-infrastructure:
    build:
      context: ./services/core/network-infrastructure
      dockerfile: Dockerfile
    container_name: od-network-infrastructure
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=--max-old-space-size=128
      - PORT=3007
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD}@postgres/network
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - ENABLE_DNS_SERVER=${ENABLE_DNS_SERVER:-true}
      - ENABLE_DHCP_SERVER=${ENABLE_DHCP_SERVER:-true}
      - ENABLE_FILE_SHARES=${ENABLE_FILE_SHARES:-true}
      - ENABLE_NETWORK_DISCOVERY=${ENABLE_NETWORK_DISCOVERY:-true}
      - ENABLE_NETWORK_MONITORING=false
      - BIND_CONFIG_PATH=/etc/bind
      - DHCP_CONFIG_PATH=/etc/dhcp
      - SAMBA_CONFIG_PATH=/etc/samba
    ports:
      - "3007:3007"
      - "53:53/tcp"
      - "53:53/udp"
      - "67:67/udp"
      - "68:68/udp"
      - "139:139"
      - "445:445"
      - "2049:2049"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - network-dns-config:/etc/bind
      - network-dhcp-config:/etc/dhcp
      - network-samba-config:/etc/samba
      - network-shares:/srv/shares
    privileged: true
    cap_add:
      - NET_ADMIN
      - NET_RAW
    deploy:
      resources:
        limits:
          memory: 192M
    restart: unless-stopped
    profiles:
      - network

  # =====================================================
  # MODUL: printers (~192 MB)
  # Drucker-Management mit CUPS, Auto-Discovery, Scanner
  # =====================================================

  printer-service:
    build:
      context: ./services/core/printer-service
      dockerfile: Dockerfile
    container_name: od-printer-service
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - NODE_OPTIONS=--max-old-space-size=128
      - PORT=3006
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD}@postgres/printers
      - REDIS_URL=redis://:${REDIS_PASSWORD}@redis:6379
      - CUPS_HOST=localhost
      - CUPS_PORT=631
      - ENABLE_DISCOVERY=true
      - ENABLE_SCANNING=true
    ports:
      - "3006:3006"
      - "631:631"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - printer-spool:/var/spool/cups
      - printer-config:/etc/cups
      # FilePrinterDriverRepository / dellCatalogService default paths —
      # named volumes so imported printer drivers and driver-catalog caches
      # survive container recreation (previously unmounted -> data loss).
      - printer-drivers:/var/lib/opendirectory/printer-drivers
      - driver-catalogs:/var/lib/opendirectory/driver-catalogs
    privileged: true
    deploy:
      resources:
        limits:
          memory: 192M
    restart: unless-stopped
    profiles:
      - printers

  # =====================================================
  # MODUL: monitoring (~384 MB)
  # Grafana Dashboards + Prometheus Metrics
  # =====================================================

  grafana:
    image: grafana/grafana:latest
    container_name: od-grafana
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3500:3000"
    networks:
      - opendirectory
    deploy:
      resources:
        limits:
          memory: 256M
    restart: unless-stopped
    profiles:
      - monitoring

  prometheus:
    image: prom/prometheus:latest
    container_name: od-prometheus
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.size=1GB'
      - '--storage.tsdb.retention.time=7d'
    ports:
      - "9090:9090"
    networks:
      - opendirectory
    deploy:
      resources:
        limits:
          memory: 192M
    restart: unless-stopped
    profiles:
      - monitoring

  # =====================================================
  # MODUL: security (~320 MB)
  # Security Scanner (CIS/NIST/STIG) + Auto-Remediation
  # =====================================================

  security-scanner:
    build:
      context: ./services/enterprise/security-scanner
    container_name: od-security-scanner
    environment:
      PORT: 3902
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      DEVICE_SERVICE_URL: http://device-service:3003
      AUTH_SERVICE_URL: http://auth-service:3002
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3902:3902"
    networks:
      - opendirectory
    depends_on:
      - redis
      - device-service
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3902/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - security

  auto-remediation:
    build:
      context: ./services/enterprise/auto-remediation
    container_name: od-auto-remediation
    environment:
      PORT: 3904
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      DEVICE_SERVICE_URL: http://device-service:3003
      SECURITY_SCANNER_URL: http://security-scanner:3902
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3904:3904"
    networks:
      - opendirectory
    depends_on:
      - redis
      - device-service
      - security-scanner
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3904/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - security

  # =====================================================
  # MODUL: lifecycle (~448 MB)
  # Device Lifecycle, Graph Explorer, Policy Simulator
  # =====================================================

  device-lifecycle:
    build:
      context: ./services/enterprise/device-lifecycle
    container_name: od-device-lifecycle
    environment:
      PORT: 3903
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      DEVICE_SERVICE_URL: http://device-service:3003
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3903:3903"
    networks:
      - opendirectory
    depends_on:
      - redis
      - device-service
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3903/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - lifecycle

  graph-explorer:
    build:
      context: ./services/enterprise/graph-explorer
    container_name: od-graph-explorer
    environment:
      PORT: 3900
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      DEVICE_SERVICE_URL: http://device-service:3003
      AUTH_SERVICE_URL: http://auth-service:3002
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3900:3900"
    networks:
      - opendirectory
    depends_on:
      - redis
      - device-service
    deploy:
      resources:
        limits:
          memory: 160M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3900/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - lifecycle

  policy-simulator:
    build:
      context: ./services/enterprise/policy-simulator
    container_name: od-policy-simulator
    environment:
      PORT: 3901
      NODE_ENV: production
      NODE_OPTIONS: --max-old-space-size=128
      DEVICE_SERVICE_URL: http://device-service:3003
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
    ports:
      - "3901:3901"
    networks:
      - opendirectory
    depends_on:
      - redis
      - device-service
    deploy:
      resources:
        limits:
          memory: 128M
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3901/health"]
      interval: 30s
      timeout: 10s
      retries: 3
    profiles:
      - lifecycle

# =====================================================
# Networks & Volumes
# =====================================================

networks:
  opendirectory:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  lldap-data:
  printer-spool:
  printer-config:
  network-dns-config:
  network-dhcp-config:
  network-samba-config:
  network-shares:
  grafana-data:
  prometheus-data:
  device-drivers:    # /var/lib/opendirectory/device-drivers (device-service)
  device-hardware:   # /var/lib/opendirectory/device-hardware (device-service)
  printer-drivers:   # /var/lib/opendirectory/printer-drivers (printer-service)
  driver-catalogs:   # /var/lib/opendirectory/driver-catalogs (printer-service)
