version: '3.9'

services:
  # ===================
  # Infrastructure
  # ===================
  
  postgres:
    image: postgres:15-alpine
    container_name: od-postgres
    environment:
      POSTGRES_USER: opendirectory
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      POSTGRES_MULTIPLE_DATABASES: identity,auth,policy,audit,integration,printers,network,oauth,certs,mdm
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init-databases.sh:/docker-entrypoint-initdb.d/init-databases.sh
    ports:
      - "5432:5432"
    networks:
      - opendirectory
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opendirectory"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: od-redis
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    networks:
      - opendirectory
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  mongodb:
    image: mongo:6
    container_name: od-mongodb
    environment:
      MONGO_INITDB_ROOT_USERNAME: opendirectory
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}
      MONGO_INITDB_DATABASE: devices
    volumes:
      - mongo-data:/data/db
    ports:
      - "27017:27017"
    networks:
      - opendirectory

  rabbitmq:
    image: rabbitmq:3-management-alpine
    container_name: od-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: opendirectory
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - opendirectory

  # ===================
  # LDAP Service
  # ===================
  
  lldap:
    image: nitnelave/lldap:stable
    container_name: od-lldap
    environment:
      - LLDAP_JWT_SECRET=${LLDAP_JWT_SECRET:?LLDAP_JWT_SECRET must be set in .env}
      - LLDAP_LDAP_BASE_DN=dc=opendirectory,dc=local
      - LLDAP_LDAP_USER_DN=admin
      - LLDAP_LDAP_USER_PASS=${LLDAP_ADMIN_PASSWORD:?LLDAP_ADMIN_PASSWORD must be set in .env}
    volumes:
      - lldap-data:/data
    ports:
      - "3890:3890"
      - "17170:17170"
    networks:
      - opendirectory

  ldap-proxy:
    build: ./services/core/ldap-proxy
    ports:
      - "1389:1389"
    environment:
      - LLDAP_URL=${LLDAP_URL:-ldap://lldap:3890}
      - LLDAP_BASE_DN=${LLDAP_BASE_DN:-dc=opendirectory,dc=local}
      - LLDAP_ADMIN_USER=${LLDAP_ADMIN_USER:-admin}
      - LLDAP_ADMIN_PASSWORD=${LLDAP_ADMIN_PASSWORD}
      - LDAP_PROXY_PORT=1389
    depends_on:
      - lldap
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "node", "-e", "require('net').createConnection(1389,'localhost').on('connect',()=>process.exit(0)).on('error',()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3

  # ===================
  # Core Services (from /services/core)
  # ===================
  
  identity-service:
    build:
      context: ./services/core/identity-service
      dockerfile: Dockerfile
    container_name: od-identity-service
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3001
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres/identity
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - RABBITMQ_URL=amqp://opendirectory:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@rabbitmq:5672
    ports:
      - "3001:3001"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3001/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./services/core/identity-service:/app
      - /app/node_modules

  auth-service:
    build:
      context: ./services/core/authentication-service
      dockerfile: Dockerfile
    container_name: od-auth-service
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3002
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres/auth
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - LDAP_URL=ldap://lldap:3890
    ports:
      - "3002:3002"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3002/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./services/core/auth-service:/app
      - /app/node_modules

  oauth-provider:
    build:
      context: ./services/core/oauth-provider
      dockerfile: Dockerfile
    container_name: od-oauth-provider
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - OAUTH_PROVIDER_PORT=3010
      - OAUTH_ISSUER=${OAUTH_ISSUER:-https://opendirectory.local}
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres/oauth
    ports:
      - "3015:3010"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 15s
    volumes:
      - ./services/core/oauth-provider:/app
      - /app/node_modules

  device-service:
    build:
      context: ./services/core/device-service
      dockerfile: Dockerfile
    container_name: od-device-service
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3003
      - MONGODB_URL=mongodb://opendirectory:${MONGO_PASSWORD:?MONGO_PASSWORD must be set in .env}@mongodb:27017/devices
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - RABBITMQ_URL=amqp://opendirectory:${RABBITMQ_PASSWORD:?RABBITMQ_PASSWORD must be set in .env}@rabbitmq:5672
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=devices
      - DB_USER=opendirectory
      - DB_PASSWORD=${DB_PASSWORD:?DB_PASSWORD must be set in .env}
    ports:
      - "3003:3003"
    networks:
      - opendirectory
    depends_on:
      - mongodb
      - redis
      - rabbitmq
      - postgres
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3003/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./services/core/device-service:/app
      - /app/node_modules

  policy-service:
    build:
      context: ./services/core/policy-service
      dockerfile: Dockerfile
    container_name: od-policy-service
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3004
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres/policy
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - DEVICE_SERVICE_URL=http://device-service:3003
    ports:
      - "3004:3004"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3004/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./services/core/policy-service:/app
      - /app/node_modules

  # ===================
  # Platform Services
  # ===================
  
  api-gateway:
    build:
      context: ./services/core/api-gateway
      dockerfile: Dockerfile
    container_name: od-api-gateway
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8080
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=${POSTGRES_DB:-opendirectory}
      - DB_USER=${POSTGRES_USER:-postgres}
      - DB_PASSWORD=${POSTGRES_PASSWORD:?POSTGRES_PASSWORD must be set in .env}
      - INTEGRATION_HUB_HOST=integration-hub
      - INTEGRATION_HUB_GRAPHQL_PORT=3001
      - LOG_LEVEL=info
      - CORS_ORIGIN=${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}
    ports:
      - "3010:8080"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./services/core/api-gateway:/app
      - /app/node_modules

  api-backend:
    build:
      context: ./services/platform/api-backend
      dockerfile: Dockerfile
    container_name: od-api-backend
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=8080
      - CORS_ORIGIN=http://localhost:3000
      - JWT_SECRET=${JWT_SECRET:?JWT_SECRET must be set in .env}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD:?ADMIN_PASSWORD must be set in .env}
      - CT2001_HOST=${CT2001_HOST:-192.168.1.51}
      - CT2001_USERNAME=${CT2001_USERNAME:-root}
      - CT2001_PORT=${CT2001_PORT:-22}
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres/api
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
    ports:
      - "8080:8080"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./services/platform/api-backend:/app
      - /app/node_modules

  integration-service:
    build:
      context: ./services/platform/integration-service
      dockerfile: Dockerfile
    container_name: od-integration-service
    restart: unless-stopped
    environment:
      - NODE_ENV=production
      - PORT=4000
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres/integration
      - LLDAP_URL=http://lldap:17170
      - LLDAP_ADMIN_USER=admin
      - LLDAP_ADMIN_PASSWORD=${LLDAP_ADMIN_PASSWORD:?LLDAP_ADMIN_PASSWORD must be set in .env}
      - GRAFANA_URL=${GRAFANA_URL:-http://grafana:3000}
      - PROMETHEUS_URL=${PROMETHEUS_URL:-http://prometheus:9090}
      - VAULT_URL=${VAULT_URL:-http://vault:8200}
    ports:
      - "4000:4000"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      lldap:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:4000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # No source mounts — Dockerfile builds TypeScript to dist/ inside image

  # ===================
  # Printer Service
  # ===================
  
  printer-service:
    build:
      context: ./services/core/printer-service
      dockerfile: Dockerfile
    container_name: od-printer-service
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3006
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres/printers
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - CUPS_HOST=localhost
      - CUPS_PORT=631
      - ENABLE_DISCOVERY=true
      - ENABLE_SCANNING=true
    ports:
      - "3006:3006"
      - "631:631"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3006/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    volumes:
      - ./services/core/printer-service:/app
      - /app/node_modules
      - printer-spool:/var/spool/cups
      - printer-cache:/var/cache/cups
      - printer-config:/etc/cups
      - scanned-documents:/var/scans
    privileged: true  # Required for CUPS and device access
    devices:
      - /dev/bus/usb:/dev/bus/usb  # USB printers/scanners

  # ===================
  # Network Infrastructure Service
  # ===================
  
  network-infrastructure:
    build:
      context: ./services/core/network-infrastructure
      dockerfile: Dockerfile
    container_name: od-network-infrastructure
    restart: unless-stopped
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3007
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres/network
      - REDIS_URL=redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
      - ENABLE_DNS_SERVER=true
      - ENABLE_DHCP_SERVER=true
      - ENABLE_FILE_SHARES=true
      - ENABLE_NETWORK_DISCOVERY=true
      - ENABLE_NETWORK_MONITORING=true
      - BIND_CONFIG_PATH=/etc/bind
      - DHCP_CONFIG_PATH=/etc/dhcp
      - SAMBA_CONFIG_PATH=/etc/samba
    ports:
      - "3007:3007"
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3007/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  # ===================
  # Samba AD Domain Controller
  # ===================

  samba-ad-dc:
    build:
      context: ./services/core/samba-ad-dc
      dockerfile: Dockerfile
    container_name: od-samba-ad-dc
    restart: unless-stopped
    privileged: true          # Required for Kerberos, LDAP socket and Samba kernel modules
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=3010
      - DATABASE_URL=postgres://opendirectory:${DB_PASSWORD:?DB_PASSWORD must be set in .env}@postgres/samba
      - AD_DOMAIN=${AD_DOMAIN:-opendirectory.local}
      - AD_REALM=${AD_REALM:-OPENDIRECTORY.LOCAL}
      - SAMBA_CONFIG_PATH=/etc/samba
    ports:
      - "3010:3010"   # REST API
      - "389:389"     # LDAP
      - "636:636"     # LDAPS
      - "88:88"       # Kerberos
      - "88:88/udp"   # Kerberos UDP
      - "464:464"     # kpasswd
      - "445:445"     # SMB / CIFS
      - "135:135"     # DCE/RPC endpoint mapper
      - "3268:3268"   # Global Catalog
      - "3269:3269"   # Global Catalog SSL
    volumes:
      - samba-data:/var/lib/samba        # SAM database, SYSVOL, NETLOGON (persistent)
      - samba-config:/etc/samba          # smb.conf, Kerberos config (persistent)
      - samba-logs:/var/log/samba
    networks:
      - opendirectory
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3010/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s   # Samba provisioning can take up to 60 s

  # ===================
  # Frontend
  # ===================

  web-app:
    build:
      context: ./frontend/web-app
      dockerfile: Dockerfile
    container_name: od-web-app
    restart: unless-stopped
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
      - NEXT_PUBLIC_WS_URL=ws://localhost:8080
      - NEXT_PUBLIC_AD_DOMAIN=${AD_DOMAIN:-opendirectory.local}
      - NEXT_PUBLIC_APP_URL=${APP_URL:-https://opendirectory.heusser.local}
      - NEXT_PUBLIC_SAMBA_URL=http://samba-ad-dc:3010
      - INTEGRATION_SERVICE_URL=http://integration-service:4000
      - PRINTER_SERVICE_URL=http://printer-service:3006
      - APP_STORE_URL=http://app-store:3906
    ports:
      - "3000:3000"
    networks:
      - opendirectory
    depends_on:
      - api-backend
      - integration-service
      - app-store
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    # No source mounts — the Dockerfile builds the app into the image.


  # ===================
  # Monitoring (Optional)
  # ===================
  
  grafana:
    image: grafana/grafana:latest
    container_name: od-grafana
    restart: unless-stopped
    environment:
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:?GRAFANA_PASSWORD must be set in .env}
      - GF_INSTALL_PLUGINS=redis-datasource
    volumes:
      - grafana-data:/var/lib/grafana
    ports:
      - "3500:3000"
    networks:
      - opendirectory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s

  prometheus:
    image: prom/prometheus:latest
    container_name: od-prometheus
    restart: unless-stopped
    volumes:
      - ./infrastructure/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
    ports:
      - "9090:9090"
    networks:
      - opendirectory
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9090/-/healthy"]
      interval: 30s
      timeout: 10s
      retries: 3

  node-exporter:
    image: prom/node-exporter:latest
    container_name: od-node-exporter
    restart: unless-stopped
    pid: host
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/rootfs:ro
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/rootfs'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
    ports:
      - "9100:9100"
    networks:
      - opendirectory

  # ===================
  # Secrets Management
  # ===================

  vault:
    image: hashicorp/vault:latest
    container_name: od-vault
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_TOKEN:-opendirectory-root-token}
      VAULT_DEV_LISTEN_ADDRESS: "0.0.0.0:8200"
      VAULT_ADDR: "http://0.0.0.0:8200"
    cap_add:
      - IPC_LOCK
    ports:
      - "8200:8200"
    networks:
      - opendirectory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://localhost:8200"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # ===================
  # Intelligence Services
  # ===================

  graph-explorer:
    build:
      context: ./services/enterprise/graph-explorer
    container_name: od-graph-explorer
    environment:
      PORT: 3900
      NODE_ENV: production
      DEVICE_SERVICE_URL: http://device-service:3003
      AUTH_SERVICE_URL: http://auth-service:3002
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
    ports:
      - "3900:3900"
    networks:
      - opendirectory
    depends_on:
      - redis
      - device-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3900/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  policy-simulator:
    build:
      context: ./services/enterprise/policy-simulator
    container_name: od-policy-simulator
    environment:
      PORT: 3901
      NODE_ENV: production
      DEVICE_SERVICE_URL: http://device-service:3003
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
    ports:
      - "3901:3901"
    networks:
      - opendirectory
    depends_on:
      - redis
      - device-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3901/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  security-scanner:
    build:
      context: ./services/enterprise/security-scanner
    container_name: od-security-scanner
    environment:
      PORT: 3902
      NODE_ENV: production
      DEVICE_SERVICE_URL: http://device-service:3003
      AUTH_SERVICE_URL: http://auth-service:3002
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
    ports:
      - "3902:3902"
    networks:
      - opendirectory
    depends_on:
      - redis
      - device-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3902/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  device-lifecycle:
    build:
      context: ./services/enterprise/device-lifecycle
    container_name: od-device-lifecycle
    environment:
      PORT: 3903
      NODE_ENV: production
      DEVICE_SERVICE_URL: http://device-service:3003
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
    ports:
      - "3903:3903"
    networks:
      - opendirectory
    depends_on:
      - redis
      - device-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3903/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  antivirus-protection:
    build:
      context: ./services/enterprise/antivirus-protection
    container_name: od-antivirus-protection
    environment:
      PORT: 3905
      NODE_ENV: production
      DEVICE_SERVICE_URL: http://device-service:3003
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
    ports:
      - "3905:3905"
    networks:
      - opendirectory
    depends_on:
      - redis
      - device-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3905/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  auto-remediation:
    build:
      context: ./services/enterprise/auto-remediation
    container_name: od-auto-remediation
    environment:
      PORT: 3904
      NODE_ENV: production
      DEVICE_SERVICE_URL: http://device-service:3003
      SECURITY_SCANNER_URL: http://security-scanner:3902
      REDIS_URL: redis://:${REDIS_PASSWORD:?REDIS_PASSWORD must be set in .env}@redis:6379
    ports:
      - "3904:3904"
    networks:
      - opendirectory
    depends_on:
      - redis
      - device-service
      - security-scanner
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3904/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── App Store ──────────────────────────────────────────────────────────────
  app-store:
    build:
      context: ./services/enterprise/app-store
      dockerfile: Dockerfile
    container_name: opendirectory-app-store
    environment:
      PORT: 3906
      NODE_ENV: production
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME:-opendirectory}
      DB_USER: ${DB_USER:-opendirectory}
      DB_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD must be set in .env}
      DEVICE_SERVICE_URL: http://device-service:3003
      LLDAP_URL: http://lldap:17170
    ports:
      - "3906:3906"
    networks:
      - opendirectory
    depends_on:
      - postgres
      - device-service
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3906/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # ── Least Privilege Service ────────────────────────────────────────────────────
  least-privilege:
    build:
      context: ./services/core/least-privilege
      dockerfile: Dockerfile
    container_name: od-least-privilege
    environment:
      LEAST_PRIVILEGE_PORT: 3011
      NODE_ENV: production
    ports:
      - "3011:3011"
    networks:
      - opendirectory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3011/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  certificate-authority:
    build: ./services/core/certificate-authority
    ports:
      - "3012:3012"
    environment:
      - CA_PORT=3012
      - CA_COMMON_NAME=OpenDirectory Internal CA
      - CA_ORG=${CA_ORG:-OpenDirectory}
      - CA_COUNTRY=${CA_COUNTRY:-CH}
      - DB_HOST=postgres
      - DB_NAME=certs
      - DB_USER=${DB_USER:-postgres}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      - postgres
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3012/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  kerberos-kdc:
    build: ./services/core/kerberos-kdc
    ports:
      - "88:88/tcp"
      - "88:88/udp"
      - "749:749/tcp"
      - "3013:3013/tcp"
    environment:
      - KRB5_REALM=${KRB5_REALM:-OPENDIRECTORY.LOCAL}
      - KDC_HOST=${KDC_HOST:-kerberos-kdc}
      - KRB5_ADMIN_PASSWORD=${KRB5_ADMIN_PASSWORD:-changeme}
      - KRB5_DB_PASSWORD=${KRB5_DB_PASSWORD:-changeme}
      - KDC_API_PORT=3013
    volumes:
      - kerberos_data:/var/lib/krb5kdc
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3013/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # ── Apple MDM ──────────────────────────────────────────────────────────────
  # Real Apple MDM server: enrollment profiles, APNs push, DeviceLock/Erase/
  # InstallApplication/InstallProfile/RemoveProfile commands.
  # Requires an MDM push certificate from https://identity.apple.com/pushcert/
  # Set APNS_CERT and APNS_KEY as base64-encoded PEM strings.
  apple-mdm:
    build: ./services/core/apple-mdm
    container_name: od-apple-mdm
    ports:
      - "3014:3014"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - APPLE_MDM_PORT=3014
      - MDM_SERVER_URL=${MDM_SERVER_URL:-http://localhost:3014}
      - MDM_ORG_NAME=${MDM_ORG_NAME:-OpenDirectory}
      - APNS_CERT=${APNS_CERT:-}
      - APNS_KEY=${APNS_KEY:-}
      - APNS_TOPIC=${APNS_TOPIC:-}
      - MDM_TOPIC=${MDM_TOPIC:-}
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_NAME=mdm
      - DB_USER=${DB_USER:-opendirectory}
      - DB_PASSWORD=${DB_PASSWORD}
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - opendirectory
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://localhost:3014/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

# ===================
# Networks
# ===================

networks:
  opendirectory:
    driver: bridge

# ===================
# Volumes
# ===================

volumes:
  postgres-data:
  redis-data:
  mongo-data:
  rabbitmq-data:
  lldap-data:
  grafana-data:
  prometheus-data:
  printer-spool:
  printer-cache:
  printer-config:
  scanned-documents:
  network-dns-config:
  network-dhcp-config:
  network-samba-config:
  network-shares:
  network-logs:
  kerberos_data:
  samba-data:      # /var/lib/samba — SAM DB, SYSVOL, NETLOGON, Kerberos keytab
  samba-config:    # /etc/samba — smb.conf, krb5.conf
  samba-logs:      # /var/log/samba