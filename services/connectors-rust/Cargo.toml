[package]
name = "opendirectory-connectors"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
httpdate = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
url = "2"
uuid = { version = "1", features = ["serde"] }

[profile.release]
strip = true
