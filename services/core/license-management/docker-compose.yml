services:
  license-management:
    build: .
    ports:
      - "${LICENSE_BIND_ADDRESS:-127.0.0.1}:${LICENSE_SERVICE_PORT:-3018}:3018"
    environment:
      NODE_ENV: production
      LICENSE_SERVICE_PORT: 3018
      POLICY_SERVICE_URL: ${POLICY_SERVICE_URL:-http://policy-service:3004}
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000}
    networks:
      - opendirectory-network
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3018/health"]
      interval: 30s
      timeout: 10s
      retries: 3

networks:
  opendirectory-network:
    external: true
    name: ${OPENDIRECTORY_NETWORK:-opendirectory-network}
